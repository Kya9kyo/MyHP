<script data-goatcounter="https://kya9kyo.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script>
fetch("https://kya9kyo.goatcounter.com/counter/%2FMyHP.json")
    .then(response => response.json())
    .then(data => {
        const count = parseInt(data.count.replace(/,/g, ""), 10);
        document.getElementById("visitor-count").textContent =
            String(count).padStart(6, "0");
    });
</script>
