<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>道の駅 - My HP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="travel-page">

    <h1>道の駅</h1>

<button id="show-all">すべて</button>
<button id="show-visited">行ったところ</button>

<div id="place-list"></div>

    <p>
        <a href="travel.html">← TRAVELへ戻る</a>
    </p>

<script src="DATA/places.js"></script>

<script>
    const roadsideStations = places.filter(place => place.categoryId === "01");

    const placeList = document.getElementById("place-list");

const prefectureOrder = [
    "北海道",
    "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
    "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
    "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県",
    "岐阜県", "静岡県", "愛知県", "三重県",
    "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県",
    "鳥取県", "島根県", "岡山県", "広島県", "山口県",
    "徳島県", "香川県", "愛媛県", "高知県",
    "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県",
    "沖縄県"
];

roadsideStations.sort((a, b) => {
    return prefectureOrder.indexOf(a.prefecture) -
           prefectureOrder.indexOf(b.prefecture);
});

let currentPrefecture = "";

    roadsideStations.forEach(place => {
    if (place.prefecture !== currentPrefecture) {
        const prefectureTitle = document.createElement("h2");
        prefectureTitle.textContent = place.prefecture;
        placeList.appendChild(prefectureTitle);

        currentPrefecture = place.prefecture;
    }
        const item = document.createElement("p");
        item.innerHTML =
    (place.visited ? "✓ " : "□ ") +
    `<a href="place.html?id=${place.id}">${place.name}</a>`;

        placeList.appendChild(item);
    });

document.getElementById("show-all").addEventListener("click", () => {
    location.reload();
});

document.getElementById("show-visited").addEventListener("click", () => {

    placeList.innerHTML = "";

    roadsideStations
        .filter(place => place.visited === true)
        .forEach(place => {
            const item = document.createElement("p");
            item.innerHTML =
    `✓ <a href="place.html?id=${place.id}">${place.name}</a>`;
            placeList.appendChild(item);
        });
});

</script>

</body>

</html>
